[package]
name = "chainproxy"
version = "1.0.0"
edition = "2021"
description = "Production-grade Linux Chained WireGuard & WARP Proxy Daemon"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Grandova/WG-Chain-Warp"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
ipnet = { version = "2.10", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
tempfile = "3.17"
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
