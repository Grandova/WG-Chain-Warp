name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Sooya Linux Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build Static x86_64 Package (sooya-linux-amd64.tar.gz)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p dist/sooya
          cp target/x86_64-unknown-linux-musl/release/sooya dist/sooya/sooya
          cp systemd/sooya.service dist/sooya/sooya.service
          chmod +x dist/sooya/sooya
          tar -czvf dist/sooya-linux-amd64.tar.gz -C dist sooya
          cp dist/sooya/sooya dist/sooya-linux-amd64

      - name: Verify Static Binary
        run: |
          file dist/sooya-linux-amd64
          ldd dist/sooya-linux-amd64 || true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum sooya-linux-amd64 > sooya-linux-amd64.sha256
          sha256sum sooya-linux-amd64.tar.gz > sooya-linux-amd64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/sooya-linux-amd64.tar.gz
            dist/sooya-linux-amd64
            dist/sooya-linux-amd64.tar.gz.sha256
            dist/sooya-linux-amd64.sha256
            scripts/install.sh
          draft: false
          prerelease: false
          generate_release_notes: true
