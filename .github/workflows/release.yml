name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build Static x86_64 Binary
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/chainproxy dist/chainproxy-linux-amd64
          chmod +x dist/chainproxy-linux-amd64
          tar -czvf dist/chainproxy-linux-amd64.tar.gz -C dist chainproxy-linux-amd64

      - name: Verify Static Binary
        run: |
          file dist/chainproxy-linux-amd64
          ldd dist/chainproxy-linux-amd64 || true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum chainproxy-linux-amd64 > chainproxy-linux-amd64.sha256
          sha256sum chainproxy-linux-amd64.tar.gz > chainproxy-linux-amd64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/chainproxy-linux-amd64
            dist/chainproxy-linux-amd64.tar.gz
            dist/chainproxy-linux-amd64.sha256
            dist/chainproxy-linux-amd64.tar.gz.sha256
            scripts/install.sh
          draft: false
          prerelease: false
          generate_release_notes: true
