[package]
name = "sooya"
version = "1.6.10"
edition = "2021"
description = "Sooya - Lightweight Linux Chained WireGuard & WARP Proxy with Web Panel"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Grandova/WG-Chain-Warp"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
ipnet = { version = "2.10", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.17"
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
boringtun = "0.7.1"
tokio = { version = "1.43", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
